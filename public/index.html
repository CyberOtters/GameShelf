<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameShelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1512;
      --paper: #faf1de;
      --card: #fffaf0;
      --tomato: #ff5d40;
      --teal: #1fa596;
      --gold: #ffc53d;
      --shadow: 6px 6px 0 var(--ink);
      --shadow-sm: 3px 3px 0 var(--ink);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Karla", sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(var(--ink) 1px, transparent 1.4px);
      background-size: 26px 26px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--paper);
      opacity: 0.88;
      pointer-events: none;
    }

    .deco {
      position: fixed;
      font-family: "Bungee", cursive;
      font-size: clamp(3rem, 8vw, 6rem);
      opacity: 0.14;
      pointer-events: none;
      user-select: none;
      animation: bob 6s ease-in-out infinite;
    }
    .deco.d1 { top: 8%; left: 6%; rotate: -12deg; }
    .deco.d2 { bottom: 10%; right: 7%; rotate: 9deg; animation-delay: -2s; }
    .deco.d3 { top: 14%; right: 12%; rotate: 6deg; font-size: clamp(2rem, 5vw, 3.5rem); animation-delay: -4s; }
    .deco.d4 { bottom: 16%; left: 10%; rotate: -7deg; font-size: clamp(2rem, 5vw, 3.5rem); animation-delay: -3s; }

    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -14px; }
    }

    .stage {
      position: relative;
      width: min(420px, 100%);
      opacity: 0; /* hidden until session check resolves */
    }
    .stage.ready {
      animation: drop-in 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }

    @keyframes drop-in {
      from { translate: 0 -40px; opacity: 0; }
      to { translate: 0 0; opacity: 1; }
    }

    .logo {
      text-align: center;
      margin-bottom: 1.6rem;
    }
    .logo h1 {
      font-family: "Bungee", cursive;
      font-size: clamp(2rem, 7vw, 2.6rem);
      letter-spacing: 0.02em;
      line-height: 1;
      text-shadow: 3px 3px 0 var(--gold);
    }
    .logo h1 .accent { color: var(--tomato); text-shadow: 3px 3px 0 var(--ink); }

    .card {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .ridges {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      background: var(--teal);
      border-bottom: 3px solid var(--ink);
    }
    .ridges span {
      flex: 1;
      height: 8px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 4px;
    }

    .card-title {
      font-family: "Bungee", cursive;
      font-size: 0.95rem;
      text-align: center;
      padding: 0.9rem 0.5rem;
      background: var(--gold);
      border-bottom: 3px solid var(--ink);
    }

    .card-body { padding: 1.6rem 1.5rem 1.7rem; display: grid; gap: 1.05rem; }

    /* player badge */
    .badge {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .avatar {
      font-family: "Bungee", cursive;
      font-size: 1.5rem;
      color: var(--card);
      background: var(--tomato);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .who { display: grid; gap: 0.15rem; min-width: 0; }
    .who .label {
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .who .name {
      font-family: "Bungee", cursive;
      font-size: 1.15rem;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .stat {
      display: grid;
      gap: 0.3rem;
      padding: 0.7rem 0.85rem;
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
    }
    .stat .label {
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .stat .value {
      font-weight: 600;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .btn {
      font-family: "Bungee", cursive;
      font-size: 1rem;
      text-align: center;
      text-decoration: none;
      display: block;
      padding: 0.85rem;
      margin-top: 0.3rem;
      color: var(--card);
      background: var(--tomato);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: translate 0.1s, box-shadow 0.1s;
    }
    .btn:hover { translate: -2px -2px; box-shadow: 5px 5px 0 var(--ink); }
    .btn:active { translate: 3px 3px; box-shadow: 0 0 0 var(--ink); }
    .btn.ghost { color: var(--ink); background: var(--card); }
  </style>
</head>
<body>
  <span class="deco d1">A</span>
  <span class="deco d2">B</span>
  <span class="deco d3">↑↑↓↓</span>
  <span class="deco d4">←→←→</span>

  <main class="stage" id="stage">
    <header class="logo">
      <h1>GAME<span class="accent">SHELF</span></h1>
    </header>

    <section class="card">
      <div class="ridges" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="card-title" id="card-title">Loading…</div>
      <div class="card-body" id="card-body"></div>
    </section>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const title = document.getElementById("card-title");
    const body = document.getElementById("card-body");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function stat(label, value) {
      const box = el("div", "stat");
      box.append(el("span", "label", label), el("span", "value", value));
      return box;
    }

    async function render() {
      const res = await fetch("/api/me");
      const session = res.ok ? await res.json() : null;

      if (session?.user) {
        const { name, email } = session.user;
        title.textContent = "Player Card";

        const badge = el("div", "badge");
        const avatar = el("div", "avatar", (name || "?").trim().charAt(0).toUpperCase());
        const who = el("div", "who");
        who.append(el("span", "label", "Now playing"), el("span", "name", name));
        badge.append(avatar, who);

        const signOut = el("button", "btn", "Sign Out");
        signOut.addEventListener("click", async () => {
          await fetch("/api/auth/sign-out", { method: "POST" });
          location.reload();
        });

        body.append(badge, stat("Email", email), signOut);
      } else {
        title.textContent = "No Player Found";
        const signIn = el("a", "btn", "Insert Coin");
        signIn.href = "/login";
        const register = el("a", "btn ghost", "New Game");
        register.href = "/register";
        body.append(signIn, register);
      }
      stage.classList.add("ready");
    }

    render();
  </script>
</body>
</html>
