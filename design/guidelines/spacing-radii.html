<!-- @dsCard group="Spacing" viewport="700x150" name="Corner Radii" subtitle="--radius-sm to --radius-xl" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--paper);height:110px;box-sizing:border-box;font-family:var(--font-body);font-size:10px;font-weight:700;color:var(--ink)">
<div style="display:grid;gap:6px;justify-items:center"><div style="width:50px;height:50px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius-sm)"></div>sm 4px</div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:50px;height:50px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--radius-md)"></div>md 10px</div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:50px;height:50px;background:var(--card);border:3px solid var(--ink);border-radius:var(--radius-lg)"></div>lg 12px</div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:50px;height:50px;background:var(--card);border:3px solid var(--ink);border-radius:var(--radius-xl)"></div>xl 18px</div>
</div>
