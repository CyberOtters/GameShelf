<!-- @dsCard group="Colors" viewport="700x120" name="Status Colors" subtitle="GameStatus mapping" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;height:120px;font-family:var(--font-body);font-size:12px;font-weight:700">
<div style="flex:1;background:var(--status-backlog);color:var(--ink);display:flex;align-items:flex-end;padding:10px">Backlog</div>
<div style="flex:1;background:var(--status-playing);color:var(--ink);display:flex;align-items:flex-end;padding:10px">Playing</div>
<div style="flex:1;background:var(--status-completed);color:var(--ink);display:flex;align-items:flex-end;padding:10px">Completed</div>
<div style="flex:1;background:var(--status-dropped);color:var(--card);display:flex;align-items:flex-end;padding:10px">Dropped</div>
</div>
