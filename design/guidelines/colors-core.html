<!-- @dsCard group="Colors" viewport="700x150" name="Core Palette" subtitle="ink, paper, card, tomato, teal, gold" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-body)">
<div style="flex:1;background:var(--ink);color:var(--paper);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700">ink</div>
<div style="flex:1;background:var(--paper);color:var(--ink);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700">paper</div>
<div style="flex:1;background:var(--card);color:var(--ink);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700;border-left:1px solid #ddd">card</div>
<div style="flex:1;background:var(--tomato);color:var(--card);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700">tomato</div>
<div style="flex:1;background:var(--teal);color:var(--card);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700">teal</div>
<div style="flex:1;background:var(--gold);color:var(--ink);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700">gold</div>
</div>
