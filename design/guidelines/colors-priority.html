<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;height:120px;font-family:var(--font-body);font-size:12px;font-weight:700">
<div style="flex:1;background:var(--priority-high);color:var(--card);display:flex;align-items:flex-end;padding:10px">High</div>
<div style="flex:1;background:var(--priority-medium);color:var(--ink);display:flex;align-items:flex-end;padding:10px">Medium</div>
<div style="flex:1;background:var(--priority-low);color:var(--card);display:flex;align-items:flex-end;padding:10px">Low</div>
</div>
