<!-- @dsCard group="Brand" viewport="700x160" name="Pressable States" subtitle="hover lifts, press slams flat" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;align-items:center;gap:30px;padding:20px;background:var(--paper);height:120px;box-sizing:border-box;font-family:var(--font-display);font-size:0.85rem">
<div style="padding:0.7rem 1.1rem;background:var(--tomato);color:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:var(--shadow-sm)">rest</div>
<div style="padding:0.7rem 1.1rem;background:var(--tomato);color:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);translate:-2px -2px">hover</div>
<div style="padding:0.7rem 1.1rem;background:var(--tomato);color:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:0 0 0 var(--ink);translate:3px 3px">press</div>
</div>
