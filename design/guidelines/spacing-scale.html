<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="--space-1 through --space-6" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;align-items:flex-end;gap:10px;padding:20px;background:var(--paper);height:110px;box-sizing:border-box;font-family:var(--font-body);font-size:10px;font-weight:700;color:var(--ink)">
<div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:var(--space-1);background:var(--tomato)"></div>1</div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:var(--space-2);background:var(--tomato)"></div>2</div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:var(--space-3);background:var(--tomato)"></div>3</div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:var(--space-4);background:var(--tomato)"></div>4</div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:var(--space-5);background:var(--tomato)"></div>5</div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:24px;height:var(--space-6);background:var(--tomato)"></div>6</div>
</div>
