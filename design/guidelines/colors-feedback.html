<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;height:120px;font-family:var(--font-body);font-size:12px;font-weight:700;gap:12px;padding:10px;box-sizing:border-box;background:var(--paper)">
<div style="flex:1;background:var(--ok-bg);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center">.ok — #d2f5ef</div>
<div style="flex:1;background:var(--error-bg);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center">.error — #ffd9d2</div>
</div>
