<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="./HomeScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./AuthScreen.jsx"></script>
<script type="text/babel">
function RootApp(){
  const [route,setRoute]=React.useState('home');
  const [session,setSession]=React.useState(null);
  return (
    <div>
      <div style={{position:'fixed',top:14,left:14,zIndex:10,display:'flex',gap:8}}>
        <button onClick={()=>setRoute('home')} style={{fontFamily:'var(--font-body)',fontWeight:700,fontSize:12,padding:'6px 10px',border:'2px solid var(--ink)',borderRadius:8,background:route==='home'?'var(--gold)':'#fff',cursor:'pointer'}}>Home</button>
        <button onClick={()=>setRoute('auth')} style={{fontFamily:'var(--font-body)',fontWeight:700,fontSize:12,padding:'6px 10px',border:'2px solid var(--ink)',borderRadius:8,background:route==='auth'?'var(--gold)':'#fff',cursor:'pointer'}}>Auth</button>
      </div>
      {route==='home'
        ? <HomeScreen session={session} onSignOut={()=>setSession(null)} />
        : <AuthScreen onSubmit={()=>{setSession({name:'Ash Ketchum',email:'ash@ketchum.gg'});setRoute('home');}} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<RootApp/>);
</script>
